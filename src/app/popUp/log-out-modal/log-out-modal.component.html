<div class="modal-header">
    <h4 class="modal-title">{{'LogOut' | translate}}</h4>
</div>
<div class="modal-body">
    <p>{{ data.confirmation | translate }}</p>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss('No')">{{'Cancel'| translate}}</button>
    <button type="button" class="btn btn-primary" (click)="activeModal.close('Yes')">{{'LogOut'| translate}}</button>
</div>
